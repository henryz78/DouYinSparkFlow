services:
  dashboard:
    image: douyin-spark-flow:local
    container_name: douyin-spark-dashboard
    restart: unless-stopped
    entrypoint: ["python", "/app/dashboard/server.py"]
    environment:
      DASHBOARD_HOST: "0.0.0.0"
      DASHBOARD_PORT: "8787"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${CONFIG_ENV_FILE:-./config/.env}:/app/.env:ro
      - ${LOGS_DIR:-./logs}:/app/logs:ro
    ports:
      - "${DASHBOARD_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=2).read()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  gost:
    image: gogost/gost:latest
    profiles: ["config-tool"]
    restart: "no"
    ports: !override
      - "${GOST_BIND:-127.0.0.1}:${GOST_PORT:-9000}:9000"
